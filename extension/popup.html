<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink:#2b241d; --muted:#6b5f52; --faint:#94897b; --line:#e3d9cc; --line2:#efe8dd;
    --accent:#a56a3a; --accent-ink:#7d4e28; --bg:#fbf8f3; --card:#fff; --match:#2e7d43;
    --shadow:0 1px 3px rgba(43,36,29,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:#ece3d6; --muted:#a99c8b; --faint:#8a7e6f; --line:#40372d; --line2:#362e26;
      --accent:#d29a63; --accent-ink:#e3b686; --bg:#221c16; --card:#2a241d; --match:#7fce97;
      --shadow:0 1px 4px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { width: 328px; margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 9px; padding: 13px 14px 11px; border-bottom: 1px solid var(--line); }
  .glyph { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
  header h1 { font-size: 14px; margin: 0; font-weight: 700; }
  header .who { margin-left: auto; font-size: 12px; color: var(--muted); }
  .body { padding: 12px 14px 4px; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 14px 0 8px; }
  h2:first-child { margin-top: 2px; }
  label { font-weight: 500; }
  select, input[type=text] { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  input:focus-visible, select:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 12.5px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 9px; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, var(--card)); color: var(--accent-ink); font-weight: 600; }
  .chip .sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); flex: none; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); margin-top: 10px; }
  .btn { font: inherit; font-weight: 600; cursor: pointer; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .link { font: inherit; font-size: 13px; cursor: pointer; background: none; border: 0; color: var(--accent-ink); text-decoration: underline; padding: 0; }
  .saved { color: var(--match); font-size: 12.5px; font-weight: 600; margin-left: auto; }
  .priv { font-size: 11.5px; color: var(--muted); padding: 0 14px 12px; }
  .priv b { color: var(--match); }
  /* live status of the page under the popup */
  .pstatus { display: flex; align-items: center; gap: 8px; margin: 10px 14px 0; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .pstatus b { color: var(--ink); }
  .pstatus.on { border-color: color-mix(in srgb, var(--match) 45%, var(--line)); }
  .pstatus .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .pstatus.on .led { background: var(--match); }
  .pstatus .mini { font: inherit; font-weight: 600; cursor: pointer; margin-left: auto; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <header>
    <span class="glyph">P</span>
    <h1>Poshmark Refine</h1>
    <span class="who" id="whoLabel"></span>
  </header>
  <div class="pstatus" id="pagestatus"><span class="led"></span><span id="pstext">Checking this page&hellip;</span></div>
  <div class="body">
    <h2>Shopping for</h2>
    <select id="who"></select>

    <h2>Colours</h2>
    <div id="colours" class="chips" role="group" aria-label="Colours"></div>

    <h2>Brands</h2>
    <input id="brands" type="text" list="known-brands" placeholder="Optional. Vuori, Rails...">
    <datalist id="known-brands"></datalist>
  </div>
  <div class="foot">
    <button id="save" class="btn" type="button">Save</button>
    <button id="more" class="link" type="button">Manage family &amp; behaviour</button>
    <span id="status" class="saved" hidden>&#10003; Saved</span>
  </div>
  <p class="priv"><b>&#10003;</b> Filters run on the search page you open. Nothing leaves your browser.</p>
  <script src="popup.js"></script>
</body>
</html>
